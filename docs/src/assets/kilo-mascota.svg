<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
	<defs>
		<linearGradient id="kilo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#a855f7" />
			<stop offset="50%" stop-color="#3b82f6" />
			<stop offset="100%" stop-color="#2dd4bf" />
		</linearGradient>
		<filter id="kilo-blur" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="14" />
		</filter>
	</defs>

	<!-- resplandor detrás del cuerpo -->
	<rect x="60" y="90" width="280" height="260" rx="56" fill="url(#kilo-glow)" opacity="0.55" filter="url(#kilo-blur)" />

	<!-- cuerpo -->
	<rect x="72" y="102" width="256" height="236" rx="48" fill="url(#kilo-glow)" />
	<rect x="82" y="112" width="236" height="216" rx="40" fill="#0b0b0d" />

	<!-- gorro de cocinero -->
	<g>
		<rect x="150" y="70" width="100" height="26" rx="13" fill="#f5f5f5" />
		<path
			d="M158 74
			   C150 40, 178 18, 200 30
			   C210 14, 236 18, 238 38
			   C258 32, 270 56, 254 74
			   C254 78, 250 80, 246 80
			   L162 80
			   C158 80, 156 78, 158 74 Z"
			fill="#f5f5f5"
		/>
		<path d="M178 34 C172 46, 172 60, 178 72" stroke="#e2e2e2" stroke-width="4" fill="none" stroke-linecap="round" />
		<path d="M200 28 C196 44, 196 60, 202 74" stroke="#e2e2e2" stroke-width="4" fill="none" stroke-linecap="round" />
		<path d="M226 34 C232 46, 232 60, 226 72" stroke="#e2e2e2" stroke-width="4" fill="none" stroke-linecap="round" />
	</g>

	<!-- ojos -->
	<circle cx="152" cy="210" r="22" fill="#ffffff" />
	<circle cx="248" cy="210" r="22" fill="#ffffff" />

	<!-- sonrisa -->
	<path d="M172 250 Q200 274 228 250" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" />
</svg>
