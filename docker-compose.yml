services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: smartbite-app-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
      - "9229:9229"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # NOTA: Estos valores apuntan a Supabase local en el host.
      # No usamos ${DATABASE_URL} porque .env apunta a 127.0.0.1 (para host-side CLI).
      # Dentro del contenedor, 127.0.0.1 sería el propio contenedor.
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-your_sb_secret_key_from_supabase_status}
      CORS_ORIGIN: ${CORS_ORIGIN}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_TEXT_MODEL: ${GROQ_TEXT_MODEL:-gpt-oss-120b}
      GROQ_WHISPER_MODEL: ${GROQ_WHISPER_MODEL:-whisper-large-v3-turbo}
      GROQ_TIMEOUT: ${GROQ_TIMEOUT:-15000}
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - /app/node_modules
    command: >
      sh -c "
        echo '[SmartBite] Aplicando migraciones...' &&
        pnpm prisma migrate deploy &&
        echo '[SmartBite] Aplicando vistas, permisos e índices...' &&
        pnpm prisma db execute --file prisma/sql/01_views.sql &&
        pnpm prisma db execute --file prisma/sql/02_roles.sql &&
        pnpm prisma db execute --file prisma/sql/03_indexes.sql &&
        echo '[SmartBite] Iniciando servidor...' &&
        pnpm run start:dev
      "
